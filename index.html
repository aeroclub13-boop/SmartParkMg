<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Parking – Ultimate Showcase</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{
min-height:100vh;
background:radial-gradient(circle at top,#0f2027,#203a43,#2c5364);
display:flex;
justify-content:center;
align-items:center;
color:white;
overflow:hidden
}

.page{width:100%;max-width:1200px;padding:30px;display:none;animation:cinema 1s ease}
.page.active{display:block}
.glass{
background: rgba(255,255,255,0.14);
backdrop-filter: blur(20px);
border-radius: 28px;
box-shadow: 0 40px 100px rgba(0,0,0,0.7);
padding: 50px;
max-height: 80vh;
overflow-y: auto;
}
.glass::-webkit-scrollbar{width:8px}
.glass::-webkit-scrollbar-thumb{background:#4facfe;border-radius:10px}

h1{text-align:center;margin-bottom:25px;letter-spacing:2px;font-weight:600}
input,button{width:100%;padding:16px;border:none;border-radius:16px;margin-top:18px;font-size:16px}
input{background:rgba(255,255,255,0.25);color:white}
input::placeholder{color:#ddd}
button{background:linear-gradient(135deg,#00f2fe,#4facfe);color:white;font-weight:bold;cursor:pointer;transition:0.4s}
button:hover{transform:scale(1.08);box-shadow:0 20px 50px rgba(0,0,0,0.7)}
.code-box{background:#000;padding:28px;border-radius:18px;text-align:center;font-size:30px;letter-spacing:7px;margin-bottom:25px;box-shadow:inset 0 0 25px rgba(0,255,255,0.4)}
.counter{text-align:center;margin-bottom:15px;font-size:18px;opacity:0.9}
.parking-area{width:800px;height:600px;margin:20px auto;display:grid;grid-template-rows:1fr 70px 1fr;background:linear-gradient(180deg,#0d0d0d,#1b1b1b);border-radius:24px;padding:30px;border:3px solid rgba(255,255,255,0.25)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.road{background:repeating-linear-gradient(90deg,#b0bec5,#b0bec5 30px,#37474f 30px,#37474f 60px);border-radius:12px;box-shadow:inset 0 0 20px rgba(0,0,0,0.8)}
.spot{border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:22px;font-weight:bold;letter-spacing:1px;box-shadow:0 18px 40px rgba(0,0,0,0.7);transition:0.45s;cursor:pointer;position:relative}
.spot span{font-size:13px;margin-top:6px;letter-spacing:1px}
.spot.empty{background:linear-gradient(145deg,#00e676,#00c853);animation:glow 2.5s infinite}
.spot.full{background:linear-gradient(145deg,#ff5252,#c62828)}
.spot.reserved{background:linear-gradient(145deg,#ffb300,#ff8f00)}
.spot:hover{transform:translateY(-12px) scale(1.1)}
.info{text-align:center;margin-top:20px;font-size:14px;opacity:0.7}
@keyframes cinema{from{opacity:0;transform:scale(0.9) translateY(40px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes glow{0%{box-shadow:0 0 15px rgba(0,255,150,0.4)}50%{box-shadow:0 0 40px rgba(0,255,150,0.9)}100%{box-shadow:0 0 15px rgba(0,255,150,0.4)}}
</style></head>
<body><!-- PAGE 1 --><div class="page active" id="p1">
  <div class="glass">
    <h1>Smart Parking</h1>
    <input type="text" id="phone" placeholder="Phone Number">
    <button onclick="validatePhone()">Enter System</button>
  </div>
</div><!-- PAGE 2 --><div class="page" id="p2">
  <div class="glass">
    <h1>Access Granted</h1>
    <div class="code-box" id="code">905314</div>
    <button onclick="copyCode()">Copy Access Code</button>
    <button onclick="go(3)">View Parking</button>
  </div>
</div><!-- PAGE 3 --><div class="page" id="p3">
  <div class="glass">
    <h1>Live Parking Status</h1>
    <div class="counter">Available: <b id="count">4</b></div><div class="parking-area">
  <div class="row">
    <div class="spot empty" onclick="reserve(this)">P1<span>EMPTY</span></div>
    <div class="spot full">P2<span>FULL</span></div>
    <div class="spot empty" onclick="reserve(this)">P3<span>EMPTY</span></div>
    <div class="spot full">P4<span>FULL</span></div>
  </div>

  <div class="road"></div>

  <div class="row">
    <div class="spot full">P5<span>FULL</span></div>
    <div class="spot empty" onclick="reserve(this)">P6<span>EMPTY</span></div>
    <div class="spot full">P7<span>FULL</span></div>
    <div class="spot empty" onclick="reserve(this)">P8<span>EMPTY</span></div>
  </div>
</div>

<div class="info">Scroll to see all parking spots and click on empty to reserve</div>

  </div>
</div><script>
function go(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p'+n).classList.add('active')}
function copyCode(){navigator.clipboard.writeText(document.getElementById('code').innerText);alert('Access code copied')}
function reserve(el){if(el.classList.contains('empty')){el.classList.remove('empty');el.classList.add('reserved');el.querySelector('span').innerText='RESERVED';let c=document.getElementById('count');c.innerText=parseInt(c.innerText)-1;}}

function validatePhone(){
  const phone=document.getElementById('phone').value.trim();
  if(phone.length===10 && /^[0-9]+$/.test(phone)){
    go(2);
  } else {
    alert('Please enter a valid 10-digit phone number');
  }
}
</script></body>
</html>
